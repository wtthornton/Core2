; PlatformIO env for M5Stack Core2 AgentForge HMI (see docs/firmware/PLAN.md).
; Flash with: python scripts/core2_dev.py upload --port COM4

[env:m5stack-core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
lib_deps =
	m5stack/M5Unified@^0.2.7
	m5stack/M5GFX@^0.2.9
	bblanchon/ArduinoJson@^7.3.0
